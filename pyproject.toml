[project]
name = "i2i-watch"
version = "1.0.0"
description = "Automated i2iFunding high-yield P2P loan intelligence scraper + notifier"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28",
    "selectolax>=0.3.25",
    "pycryptodome>=3.20",
]

[project.optional-dependencies]
browser = ["playwright>=1.50"]
firebase = ["firebase-admin>=6.5"]
dev = ["pytest>=8.0"]

[project.scripts]
i2i-watch = "i2i_watch.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
