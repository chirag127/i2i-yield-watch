name: i2i Portfolio Digest

# Weekly standing 'eyes on the system' Telegram ping: investable escrow,
# invested-loan count, open-market size and near-miss count per account.
# Silent (no buzz), places NO money. Dispatchable anytime.

on:
  schedule:
    - cron: "0 6 * * 1"   # weekly Monday 06:00 UTC (11:30 IST)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      # direct-HTTP only (same as invest.yml) — no browser, no apt-get
      - name: Setup toolchain (cached venv)
        uses: ./.github/actions/setup-i2i
        with:
          extras: ''
      - name: Send portfolio digest to Telegram
        env:
          PYTHONIOENCODING: utf-8
          I2I_ACCOUNTS: chirag,neeru
          I2I_EMAIL: ${{ secrets.I2I_EMAIL }}
          I2I_PASSWORD: ${{ secrets.I2I_PASSWORD }}
          I2I_CSRF_TOKEN: ${{ secrets.I2I_CSRF_TOKEN }}
          I2I_SESSION_ID: ${{ secrets.I2I_SESSION_ID }}
          I2I_NEERU_EMAIL: ${{ secrets.I2I_NEERU_EMAIL }}
          I2I_NEERU_PASSWORD: ${{ secrets.I2I_NEERU_PASSWORD }}
          I2I_NEERU_CSRF_TOKEN: ${{ secrets.I2I_NEERU_CSRF_TOKEN }}
          I2I_NEERU_SESSION_ID: ${{ secrets.I2I_NEERU_SESSION_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          AUTOINVEST_MIN_RATE_PCT: ${{ vars.AUTOINVEST_MIN_RATE_PCT || '100' }}
          AUTOINVEST_MIN_CREDIT_SCORE: ${{ vars.AUTOINVEST_MIN_CREDIT_SCORE || '720' }}
        run: .venv-ci/bin/python -m i2i_watch digest -v

      - name: Alert on failure (a broken digest = silent blind spot)
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          [ -z "$TELEGRAM_BOT_TOKEN" ] && { echo "no telegram token; skip alert"; exit 0; }
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          MSG="⚠️ <b>i2i PORTFOLIO DIGEST run FAILED</b>%0A${RUN_URL}"
          curl -sS --max-time 20 -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" -d parse_mode=HTML -d text="$MSG" >/dev/null \
            && echo "failure alert sent" || echo "failure alert send failed"
