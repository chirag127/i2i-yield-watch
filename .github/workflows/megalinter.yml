# MegaLinter GitHub Action configuration
# Auto-fixes formatting and linting issues on every push and PR
name: MegaLinter

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  # python flavor (~600MB) — .megalinter.yml scopes linters to the repo's
  # actual languages (python/yaml/json/markdown/bash). The old `all` flavor
  # pulled a ~2GB image for dozens of irrelevant languages.
  MEGALINTER_FLAVOR: python
  # Auto-fix all fixable issues
  APPLY_FIXES: all
  APPLY_FIXES_EVENT: push
  APPLY_FIXES_MODE: commit
  # Don't fail build on formatter issues (only real errors fail)
  FORMATTERS_DISABLE_ERRORS: true
  # GitHub token for auto-fix commits
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

permissions:
  contents: write
  pull-requests: write
  statuses: write

jobs:
  megalinter:
    name: MegaLinter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: MegaLinter
        id: ml
        uses: oxsecurity/megalinter@v10
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload MegaLinter reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: MegaLinter reports
          path: |
            megalinter-reports
            mega-linter.log
          retention-days: 7