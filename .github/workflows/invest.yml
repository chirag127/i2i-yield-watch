name: i2i Auto-Invest (REAL MONEY)

# Places REAL investments via `python -m i2i_watch invest --live --account <acct>`.
# TWO SEQUENTIAL JOBS (NOT a parallel matrix) so chirag ALWAYS gets first pick:
#   job 1 invest-chirag — the primary account, evaluates and places first, then
#                         commits its invested-loans state (git-as-DB).
#   job 2 invest-neeru  — needs: invest-chirag, so it only starts AFTER chirag
#                         has placed + pushed. Each account keeps its OWN auth
#                         secrets (I2I_NEERU_* for the secondary account; legacy
#                         I2I_* for the default chirag), its OWN rate gate
#                         (both accounts >100% — chirag first, neeru fills what's
#                         left) and its OWN data/invested-loans-<acct>.json
#                         namespace — accounts never share dedup state.
#
# AUTH = auto-login FIRST: with EMAIL + PASSWORD set, each run logs in fresh
# (client-side AES-encrypted password, passphrase kXyb3gzU) and gets new session
# tokens — no stale-token problem. CSRF/SESSION tokens are the FALLBACK
# (client.from_env uses them only if login fails or creds are absent) — session
# tokens expire, so they must never be the primary auth.
#
# REQUIRED SECRETS — set on chirag127/i2i-yield-watch (values via stdin, never
# on the command line):
#   gh secret set I2I_EMAIL    ...        # chirag
#   gh secret set I2I_PASSWORD ...
#   gh secret set I2I_TXN_PIN  ...
#   gh secret set I2I_NEERU_EMAIL ...     # neeru (whyiswhen1@gmail.com)
#   gh secret set I2I_NEERU_PASSWORD ...
#   gh secret set I2I_NEERU_TXN_PIN ...
#   gh secret set I2I_CSRF_TOKEN ...      # fallback only
#   gh secret set I2I_SESSION_ID ...      # fallback only
#   gh secret set I2I_NEERU_CSRF_TOKEN ...# fallback only
#   gh secret set I2I_NEERU_SESSION_ID ...# fallback only
# TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID already exist on this repo.

on:
  schedule:
    # Every ~10 min across the daytime IST window (UTC 04:xx-13:xx). GitHub cron
    # is BEST-EFFORT: a tick can be delayed or skipped under load. That is safe
    # here because each run is IDEMPOTENT catch-up — it re-evaluates ALL eligible
    # loans and skips any already in this account's invested-loans file — so the
    # next tick automatically covers a missed one.
    #
    # OFFSET: scrape.yml fires at :03/:18/:33/:48 — invest starts at :06/:16/...
    # so the two workflows NEVER start in the same minute (they used to be 1
    # minute apart at :02/:03 and :32/:33, right in the push-collision window).
    # The push retry loop below is the real fix; this offset shrinks how often
    # it's needed.
    - cron: "6,16,26,36,46,56 4-13 * * *"
  workflow_dispatch: {}
  repository_dispatch:
    types: [invest]

permissions:
  contents: write             # commit data/invested-loans*.json back (git-as-DB)
  actions: read               # failure-alert step reads run/job metadata via gh

jobs:
  invest-chirag:
    runs-on: ubuntu-latest
    # 45m headroom (scrape.yml's proven value): cold runners can spend 10-15 min
    # on Playwright alone, and `playwright install-deps` (apt-get) has been
    # observed hanging ~14 min on a flaky archive.ubuntu.com (2026-08-19); 15m
    # cancelled a run mid-setup. Real placement steps are minutes, not this.
    timeout-minutes: 45
    # Real money must never race itself: repeated chirag runs serialize on this
    # group while invest-neeru (below) waits for the whole job via `needs:`.
    concurrency:
      group: auto-invest-chirag
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      # NO browser install: invest lists loans via direct HTTP (auto-login +
      # paginated feed — the runner log confirms "listing via direct HTTP: N
      # loans (no browser)"). Skipping the ~150MB Chromium download AND the
      # apt-get install-deps step (the historical flaky/hanging step) makes
      # the real-money path ~1-2 min faster per job and removes the #1
      # cold-start failure mode. sources/i2i.py raises cleanly if direct HTTP
      # ever fails and Playwright is absent (never mistakes an outage for an
      # empty market).
      - name: Setup toolchain (cached venv, direct-HTTP only)
        uses: ./.github/actions/setup-i2i
        with:
          extras: ''
      - name: Auto-invest (LIVE) — chirag (primary, first pick)
        env:
          PYTHONIOENCODING: utf-8
          I2I_ACCOUNT: chirag
          # chirag (default account) — legacy unprefixed names
          I2I_EMAIL: ${{ secrets.I2I_EMAIL }}
          I2I_PASSWORD: ${{ secrets.I2I_PASSWORD }}
          I2I_TXN_PIN: ${{ secrets.I2I_TXN_PIN }}
          I2I_CSRF_TOKEN: ${{ secrets.I2I_CSRF_TOKEN }}
          I2I_SESSION_ID: ${{ secrets.I2I_SESSION_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # rate gate >100%; credit gate is centralized in src/i2i_watch/config.py
          AUTOINVEST_MIN_RATE_PCT: ${{ vars.AUTOINVEST_MIN_RATE_PCT || '100' }}
        run: .venv-ci/bin/python -m i2i_watch invest --live --account chirag -v
      - name: Commit invested-loans state (git-as-DB) — chirag
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # OWNERSHIP PARTITION: invest.yml owns ONLY data/invested-loans*.json
          # (scrape.yml commits the rest of data/). The two workflows run on
          # different schedules and must never rebase/push the same files.
          # GLOB (not explicit names): chirag is the DEFAULT account -> its
          # record lives in the legacy data/invested-loans.json (no suffix),
          # so an explicit "invested-loans-chirag.json" pathspec would NOT
          # exist and git add would abort with exit 128, staging NOTHING —
          # silently losing placed investments from git (observed 2026-08-19:
          # 5 chirag loans placed but never committed).
          git add data/invested-loans*.json data/invest-idle.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no invest state change"
          else
            git commit -m "data: i2i invested-loans chirag $(date -u +'%F %H:%MZ')"
            # A green investment job must mean its dedup/idle state reached
            # origin. Never let a failed push disappear as a successful run.
            pushed=false
            for i in 1 2 3; do
              # -X theirs: data/invest-idle.json is last-writer-wins state shared
              # by both account jobs; on a concurrent push, the remote copy is
              # newer and our own idle state is regenerated next run anyway.
              # Without it the rebase re-conflicts every retry (observed
              # 2026-08-22: neeru failed all 3 attempts on invest-idle.json).
              if git fetch origin main \
                  && git rebase -X theirs origin/main \
                  && git push origin HEAD:main; then
                pushed=true
                break
              fi
              echo "push attempt $i failed, retrying..."
              if [ -d .git/rebase-merge ] || [ -d .git/rebase-apply ]; then
                git rebase --abort
              fi
              sleep 5
            done
            if [ "$pushed" != true ]; then
              echo "::error::Investment state was not pushed after 3 attempts"
              exit 1
            fi
          fi

      - name: Alert on failure (real-money run must never fail silently)
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          [ -z "$TELEGRAM_BOT_TOKEN" ] && { echo "no telegram token; skip alert"; exit 0; }
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          STARTED=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" --jq '.created_at' 2>/dev/null || echo "unknown")
          FAIL_STEP=$(gh run view "${GITHUB_RUN_ID}" --repo "${GITHUB_REPOSITORY}" --json jobs \
            --jq '[.jobs[].steps[] | select(.conclusion == "failure")] | if length > 0 then .[0].name else "unknown" end' 2>/dev/null || echo "unknown")
          MSG="⚠️ <b>i2i AUTO-INVEST run FAILED (chirag)</b> (real money)%0AStarted: ${STARTED} UTC%0AFailing step: ${FAIL_STEP}%0ACheck it did not leave a half-placed order.%0A${RUN_URL}"
          curl -sS --max-time 20 -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" -d parse_mode=HTML -d text="$MSG" >/dev/null \
            && echo "failure alert sent" || echo "failure alert send failed"

  invest-neeru:
    needs: invest-chirag
    # chirag fails -> neeru still runs (independent account/state, real money
    # per account; fail-fast:false semantics preserved from the old matrix).
    if: always() && needs.invest-chirag.result != 'cancelled'
    runs-on: ubuntu-latest
    # Same 45m headroom as invest-chirag (cold setup / apt flakiness).
    timeout-minutes: 45
    concurrency:
      group: auto-invest-neeru
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      # Cached venv (base install, no browser): invest-chirag populated the
      # cache this run (or a prior one) — neeru hits it.
      - name: Setup toolchain (cached venv, direct-HTTP only)
        uses: ./.github/actions/setup-i2i
        with:
          extras: ''
      - name: Auto-invest (LIVE) — neeru (secondary, fills after chirag)
        env:
          PYTHONIOENCODING: utf-8
          I2I_ACCOUNT: neeru
          # neeru (secondary account) — namespaced I2I_NEERU_* names
          I2I_NEERU_EMAIL: ${{ secrets.I2I_NEERU_EMAIL }}
          I2I_NEERU_PASSWORD: ${{ secrets.I2I_NEERU_PASSWORD }}
          I2I_NEERU_TXN_PIN: ${{ secrets.I2I_NEERU_TXN_PIN }}
          I2I_NEERU_CSRF_TOKEN: ${{ secrets.I2I_NEERU_CSRF_TOKEN }}
          I2I_NEERU_SESSION_ID: ${{ secrets.I2I_NEERU_SESSION_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # same >100% rate gate as chirag; credit gate is centralized in
          # src/i2i_watch/config.py and applies identically to every account
          AUTOINVEST_MIN_RATE_PCT: ${{ vars.AUTOINVEST_MIN_RATE_PCT || '100' }}
          I2I_NEERU_AUTOINVEST_MIN_RATE_PCT: ${{ vars.I2I_NEERU_AUTOINVEST_MIN_RATE_PCT || '100' }}
        run: .venv-ci/bin/python -m i2i_watch invest --live --account neeru -v
      - name: Commit invested-loans state (git-as-DB) — neeru
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # OWNERSHIP PARTITION: invest.yml owns ONLY data/invested-loans*.json
          # (scrape.yml commits the rest of data/). The two workflows run on
          # different schedules and must never rebase/push the same files.
          # Glob like the chirag job (see its comment re: pathspec abort).
          git add data/invested-loans*.json data/invest-idle.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no invest state change"
          else
            git commit -m "data: i2i invested-loans neeru $(date -u +'%F %H:%MZ')"
            # A green investment job must mean its dedup/idle state reached
            # origin. Never let a failed push disappear as a successful run.
            pushed=false
            for i in 1 2 3; do
              # -X theirs: data/invest-idle.json is last-writer-wins state shared
              # by both account jobs; on a concurrent push, the remote copy is
              # newer and our own idle state is regenerated next run anyway.
              # Without it the rebase re-conflicts every retry (observed
              # 2026-08-22: neeru failed all 3 attempts on invest-idle.json).
              if git fetch origin main \
                  && git rebase -X theirs origin/main \
                  && git push origin HEAD:main; then
                pushed=true
                break
              fi
              echo "push attempt $i failed, retrying..."
              if [ -d .git/rebase-merge ] || [ -d .git/rebase-apply ]; then
                git rebase --abort
              fi
              sleep 5
            done
            if [ "$pushed" != true ]; then
              echo "::error::Investment state was not pushed after 3 attempts"
              exit 1
            fi
          fi

      - name: Alert on failure (real-money run must never fail silently)
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          [ -z "$TELEGRAM_BOT_TOKEN" ] && { echo "no telegram token; skip alert"; exit 0; }
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          STARTED=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" --jq '.created_at' 2>/dev/null || echo "unknown")
          FAIL_STEP=$(gh run view "${GITHUB_RUN_ID}" --repo "${GITHUB_REPOSITORY}" --json jobs \
            --jq '[.jobs[].steps[] | select(.conclusion == "failure")] | if length > 0 then .[0].name else "unknown" end' 2>/dev/null || echo "unknown")
          MSG="⚠️ <b>i2i AUTO-INVEST run FAILED (neeru)</b> (real money)%0AStarted: ${STARTED} UTC%0AFailing step: ${FAIL_STEP}%0ACheck it did not leave a half-placed order.%0A${RUN_URL}"
          curl -sS --max-time 20 -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" -d parse_mode=HTML -d text="$MSG" >/dev/null \
            && echo "failure alert sent" || echo "failure alert send failed"
