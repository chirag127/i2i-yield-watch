name: i2i Auto-Invest (REAL MONEY)

# Places REAL investments via `python -m i2i_watch invest --live --account <acct>`.
# MULTI-ACCOUNT: a matrix runs one job per portfolio account (I2I_ACCOUNT selects
# it). Each account has its OWN auth secrets (I2I_NEERU_* for the secondary
# account; legacy I2I_* for the default chirag) and its OWN rate gate
# (chirag >100%, neeru >150%) and its OWN data/invested-loans-<acct>.json
# namespace — accounts never share dedup state.
#
# AUTH = auto-login FIRST: with EMAIL + PASSWORD set, each run logs in fresh
# (client-side AES-encrypted password, passphrase kXyb3gzU) and gets new session
# tokens — no stale-token problem. CSRF/SESSION tokens are the FALLBACK
# (client.from_env uses them only if login fails or creds are absent) — session
# tokens expire, so they must never be the primary auth.
#
# REQUIRED SECRETS — set on chirag127/i2i-yield-watch (values via stdin, never
# on the command line):
#   gh secret set I2I_EMAIL    ...        # chirag
#   gh secret set I2I_PASSWORD ...
#   gh secret set I2I_TXN_PIN  ...
#   gh secret set I2I_NEERU_EMAIL ...     # neeru (whyiswhen1@gmail.com)
#   gh secret set I2I_NEERU_PASSWORD ...
#   gh secret set I2I_NEERU_TXN_PIN ...
#   gh secret set I2I_CSRF_TOKEN ...      # fallback only
#   gh secret set I2I_SESSION_ID ...      # fallback only
#   gh secret set I2I_NEERU_CSRF_TOKEN ...# fallback only
#   gh secret set I2I_NEERU_SESSION_ID ...# fallback only
# TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID already exist on this repo.

on:
  schedule:
    # Every ~10 min across the daytime IST window (UTC 04:xx-13:xx). GitHub cron
    # is BEST-EFFORT: a tick can be delayed or skipped under load. That is safe
    # here because each run is IDEMPOTENT catch-up — it re-evaluates ALL eligible
    # loans and skips any already in this account's invested-loans file — so the
    # next tick automatically covers a missed one.
    #
    # OFFSET: scrape.yml fires at :03/:18/:33/:48 — invest starts at :06/:16/...
    # so the two workflows NEVER start in the same minute (they used to be 1
    # minute apart at :02/:03 and :32/:33, right in the push-collision window).
    # The push retry loop below is the real fix; this offset shrinks how often
    # it's needed.
    - cron: "6,16,26,36,46,56 4-13 * * *"
  workflow_dispatch: {}

permissions:
  contents: write             # commit data/invested-loans*.json back (git-as-DB)

concurrency:
  group: auto-invest-${{ matrix.account }}
  cancel-in-progress: false   # never race two real-money runs for the same account

jobs:
  invest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false        # one account failing must not kill the other
      matrix:
        account: [chirag, neeru]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      # Cached venv + Playwright Chromium, shared across the matrix: chirag
      # (first job) populates the caches, neeru (second job) hits them.
      - name: Setup toolchain (cached venv + Playwright Chromium)
        uses: ./.github/actions/setup-i2i
        with:
          extras: browser
      - name: Auto-invest (LIVE)
        env:
          PYTHONIOENCODING: utf-8
          I2I_ACCOUNT: ${{ matrix.account }}
          # chirag (default account) — legacy unprefixed names
          I2I_EMAIL: ${{ secrets.I2I_EMAIL }}
          I2I_PASSWORD: ${{ secrets.I2I_PASSWORD }}
          I2I_TXN_PIN: ${{ secrets.I2I_TXN_PIN }}
          I2I_CSRF_TOKEN: ${{ secrets.I2I_CSRF_TOKEN }}
          I2I_SESSION_ID: ${{ secrets.I2I_SESSION_ID }}
          # neeru (secondary account) — namespaced I2I_NEERU_* names
          I2I_NEERU_EMAIL: ${{ secrets.I2I_NEERU_EMAIL }}
          I2I_NEERU_PASSWORD: ${{ secrets.I2I_NEERU_PASSWORD }}
          I2I_NEERU_TXN_PIN: ${{ secrets.I2I_NEERU_TXN_PIN }}
          I2I_NEERU_CSRF_TOKEN: ${{ secrets.I2I_NEERU_CSRF_TOKEN }}
          I2I_NEERU_SESSION_ID: ${{ secrets.I2I_NEERU_SESSION_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # per-account gates (config defaults chirag=100 / neeru=150; repo vars override)
          AUTOINVEST_MIN_RATE_PCT: ${{ vars.AUTOINVEST_MIN_RATE_PCT || '100' }}
          I2I_NEERU_AUTOINVEST_MIN_RATE_PCT: ${{ vars.I2I_NEERU_AUTOINVEST_MIN_RATE_PCT || '150' }}
        run: .venv-ci/bin/python -m i2i_watch invest --live --account ${{ matrix.account }} -v
      - name: Commit invested-loans state (git-as-DB)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # OWNERSHIP PARTITION: invest.yml owns ONLY data/invested-loans*.json
          # (scrape.yml commits the rest of data/). The two workflows run on
          # different schedules and must never rebase/push the same files.
          git add data/invested-loans*.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no invest state change"
          else
            git commit -m "data: i2i invested-loans ${{ matrix.account }} $(date -u +'%F %H:%MZ')"
            # Retry loop: concurrent scrape pushes can transiently reject ours —
            # rebase + retry up to 3x before giving up.
            for i in 1 2 3; do
              git pull --rebase --autostash origin main && git push && break
              echo "push attempt $i failed, retrying..."
              git rebase --abort 2>/dev/null || true
              sleep 5
            done
          fi

      - name: Alert on failure (real-money run must never fail silently)
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          [ -z "$TELEGRAM_BOT_TOKEN" ] && { echo "no telegram token; skip alert"; exit 0; }
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          MSG="⚠️ <b>i2i AUTO-INVEST run FAILED (${{ matrix.account }})</b> (real money)%0AA scheduled invest run errored — check it did not leave a half-placed order.%0A${RUN_URL}"
          curl -sS --max-time 20 -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" -d parse_mode=HTML -d text="$MSG" >/dev/null \
            && echo "failure alert sent" || echo "failure alert send failed"
