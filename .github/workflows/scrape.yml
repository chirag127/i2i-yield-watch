name: i2i Yield Watch — Auto Scraper

on:
  schedule:
    # GitHub throttles/drops high-frequency cron; a `*/5` degrades to ~hourly.
    # We ask for every 15 min (GitHub honors longer intervals far more
    # reliably) and each run SELF-LOOPS ~5 scrapes x 60s internally (see the
    # "Run scraper (self-looping)" step) to approximate 5-min polling even
    # when GitHub fires sparsely. GitHub cron is UTC.
    - cron: '3,18,33,48 * * * *'
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      reset_notify_state:
        description: 'Clear notify-state so all currently-qualifying loans re-announce once'
        type: boolean
        default: false
  repository_dispatch:
    types: [tick]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      data_changed: ${{ steps.check.outputs.changed }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[browser,dev]"

      - name: Run tests
        run: python -m pytest -q

      - name: Install Playwright Chromium
        run: python -m playwright install chromium --with-deps

      - name: Unlock git-crypt
        uses: flydiverny/setup-git-crypt@v5

      - name: Decrypt git-crypt files
        env:
          GIT_CRYPT_KEY: ${{ secrets.GIT_CRYPT_KEY }}
        run: |
          echo "$GIT_CRYPT_KEY" | base64 -d > git-crypt-key
          git-crypt unlock git-crypt-key

      - name: Run scraper (self-looping)
        env:
          # git-as-DB JSON backend only — Firestore free tier 429'd under the
          # self-loop and silently killed notifications. State lives in data/*.json.
          I2I_STORAGE: json
          # Config loaded from git-crypt-decrypted .env; secrets below override.
          TELEGRAM_ENABLED: ${{ secrets.TELEGRAM_ENABLED }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          I2I_DIGEST_HOURS: ${{ vars.I2I_DIGEST_HOURS }}
          NTFY_ENABLED: ${{ secrets.NTFY_ENABLED }}
          NTFY_BASE_URL: ${{ secrets.NTFY_BASE_URL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_USER: ${{ secrets.NTFY_USER }}
          NTFY_PASSWORD: ${{ secrets.NTFY_PASSWORD }}
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
          PRIORITY_HIGH_RATE_PCT: '70'
          PRIORITY_MEDIUM_RATE_PCT: '50'
          NOTIFY_MIN_RATE_PCT: '40'
          STARTUP_JITTER_MS: '2000'
          # Self-loop: one run polls several times ~60s apart to approximate
          # 5-min cadence even when GitHub fires only every 15-30 min. Each
          # iteration diffs against the storage the previous iteration wrote,
          # so notifications chain correctly and stay near-real-time.
        run: python -m i2i_watch --iterations 2 --interval 90 -v ${{ github.event.inputs.reset_notify_state == 'true' && '--reset-notify-state' || '' }}

      - name: Commit updated data (state persistence — dedup across runs)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "no data change"
          else
            git commit -m "data: i2i scrape $(date -u +'%F %H:%MZ')"
            git pull --rebase --autostash origin main || git rebase --abort
            git push || echo "push skipped (concurrent run won the race)"
          fi

      - name: Mark output
        id: check
        run: echo "changed=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: scrape
    runs-on: ubuntu-latest
    if: always() && needs.scrape.result == 'success'

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          ref: main

      - name: Build Pages artifact (_site = dashboard + data)
        run: |
          mkdir -p _site
          cp dashboard/index.html dashboard/app.js dashboard/styles.css _site/
          cp -r data _site/data

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
