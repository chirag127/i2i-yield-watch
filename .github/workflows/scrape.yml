name: i2i Yield Watch — Auto Scraper

on:
  schedule:
    # GitHub throttles/drops high-frequency cron; a `*/5` degrades to ~hourly.
    # We ask for every 15 min (GitHub honors longer intervals far more
    # reliably) and each run SELF-LOOPS 3 scrapes x 300s internally.
    - cron: '3,18,33,48 * * * *'
  # Do not trigger on data commits: that creates a self-triggering scrape chain
  # and collides with invest.yml's state commits.
  workflow_dispatch:
    inputs:
      reset_notify_state:
        description: 'Clear notify-state so all currently-qualifying loans re-announce once'
        type: boolean
        default: false
  repository_dispatch:
    types: [tick]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # Direct HTTP avoids the historical Playwright/apt-get cold-start failure.
      - name: Setup toolchain (cached venv, direct-HTTP only)
        uses: ./.github/actions/setup-i2i
        with:
          extras: dev

      - name: Run tests
        run: .venv-ci/bin/python -m pytest -q

      - name: Pre-flight — checkout must be clean before git-crypt unlock
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Checkout is dirty before git-crypt unlock."
            git status --porcelain
            echo "A test or setup step wrote into the checkout; isolate that write before merging."
            exit 1
          fi
          echo "checkout clean — safe to unlock git-crypt"

      - name: Unlock git-crypt
        uses: flydiverny/setup-git-crypt@v5

      - name: Decrypt git-crypt files
        env:
          GIT_CRYPT_KEY: ${{ secrets.GIT_CRYPT_KEY }}
        run: |
          echo "$GIT_CRYPT_KEY" | base64 -d > git-crypt-key
          git-crypt unlock git-crypt-key

      - name: Run scraper (self-looping)
        env:
          I2I_STORAGE: json
          I2I_EMAIL: ${{ secrets.I2I_EMAIL }}
          I2I_PASSWORD: ${{ secrets.I2I_PASSWORD }}
          I2I_CSRF_TOKEN: ${{ secrets.I2I_CSRF_TOKEN }}
          I2I_SESSION_ID: ${{ secrets.I2I_SESSION_ID }}
          TELEGRAM_ENABLED: ${{ secrets.TELEGRAM_ENABLED }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_ENABLED: ${{ secrets.NTFY_ENABLED }}
          NTFY_BASE_URL: ${{ secrets.NTFY_BASE_URL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_USER: ${{ secrets.NTFY_USER }}
          NTFY_PASSWORD: ${{ secrets.NTFY_PASSWORD }}
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
          PRIORITY_HIGH_RATE_PCT: '70'
          PRIORITY_MEDIUM_RATE_PCT: '50'
          NOTIFY_MIN_RATE_PCT: '40'
          NOTIFY_HIGH_RATE_PCT: '100'
          I2I_DIGEST_HOURS: '6'
          STARTUP_JITTER_MS: '2000'
        run: .venv-ci/bin/python -m i2i_watch --iterations 3 --interval 300 -v ${{ github.event.inputs.reset_notify_state == 'true' && '--reset-notify-state' || '' }}

      - name: Commit and publish updated data (state persistence — dedup across runs)
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Scraper owns only its state files. Investment state belongs to
          # invest.yml and must never be staged here.
          git add data/active-loans.json data/notifications-sent.json \
                  data/notify-state.json data/stats.json data/runs.json \
                  data/archive 2>/dev/null || true
          echo "=== staged files ==="
          git diff --cached --stat

          if git diff --cached --quiet; then
            echo "no data change"
          else
            git commit -m "data: i2i scrape $(date -u +'%F %H:%MZ')"

            # git-crypt leaves the decrypted .env marked modified after the
            # scraper uses it. Stash only that runtime secret on the ephemeral
            # runner; it is never staged, committed, pushed, or reapplied.
            # Any other dirty file is unexpected and must fail visibly.
            dirty_files=$(git diff --name-only)
            unexpected_dirty=$(printf '%s\n' "$dirty_files" | sed '/^$/d;/^\.env$/d;/^i2i-yield-watch-sa\.json$/d')
            if [ -n "$unexpected_dirty" ]; then
              echo "::error::Unexpected dirty file after data commit: $unexpected_dirty"
              exit 1
            fi
            if [ -n "$dirty_files" ]; then
              git stash push --quiet -m "runtime git-crypt secret; never apply" -- .env i2i-yield-watch-sa.json || true
            fi
            rm -f git-crypt-key
            if [ -n "$(git status --porcelain)" ]; then
              echo "::error::Checkout is still dirty before data push"
              git status --short
              exit 1
            fi

            # Do not use pull --autostash: it previously conflicted while
            # applying the decrypted .env and still returned success. A green
            # run now means the fresh data reached origin/main.
            pushed=false
            for i in 1 2 3; do
              if git fetch origin main \
                  && git rebase origin/main \
                  && git push origin HEAD:main; then
                pushed=true
                break
              fi
              echo "push attempt $i failed, retrying..."
              git rebase --abort 2>/dev/null || true
              sleep 5
            done
            if [ "$pushed" != true ]; then
              echo "::error::Scrape data commit was not pushed after 3 attempts"
              exit 1
            fi
          fi

      - name: Alert on failure (a broken scraper = silent missed notifications)
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          [ -z "$TELEGRAM_BOT_TOKEN" ] && { echo "no telegram token; skip alert"; exit 0; }
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          MSG="⚠️ <b>i2i SCRAPER run FAILED</b>%0ANotifications may be paused until the next good run.%0A${RUN_URL}"
          curl -sS --max-time 20 -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" -d parse_mode=HTML -d text="$MSG" >/dev/null \
            && echo "failure alert sent" || echo "failure alert send failed"

  deploy:
    needs: scrape
    runs-on: ubuntu-latest
    if: always() && needs.scrape.result == 'success'

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          ref: main

      - name: Build Pages artifact (_site = dashboard + data)
        run: |
          set -euo pipefail
          mkdir -p _site
          cp dashboard/index.html dashboard/app.js dashboard/styles.css _site/
          cp -r data _site/data
          test -s _site/index.html
          test -s _site/data/active-loans.json
          test -s _site/data/stats.json
          echo "Pages artifact data timestamp:"
          grep -m1 'lastUpdated' _site/data/stats.json || true

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
