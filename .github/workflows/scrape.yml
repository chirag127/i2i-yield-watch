name: i2i Yield Watch — Auto Scraper

on:
  schedule:
    # Each 15-minute cron window performs 25 passes at ~60-second intervals,
    # giving near-real-time notification (new loans appear within ~60s of the
    # scrape cycle starting). Notifications are sent after every pass; the
    # final pass's state is published below. The repository_dispatch tick can
    # start a catch-up run when needed, but concurrency prevents overlapping
    # scrapers.
    - cron: '3,18,33,48 * * * *'
  # Do not trigger on data commits: that creates a self-triggering scrape chain
  # and collides with invest.yml's state commits.
  workflow_dispatch:
    inputs:
      reset_notify_state:
        description: 'Clear notify-state so all currently-qualifying loans re-announce once'
        type: boolean
        default: false
  repository_dispatch:
    types: [tick]

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read        # failure-alert step reads run/job metadata via gh

concurrency:
  group: scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # Direct HTTP avoids the historical Playwright/apt-get cold-start failure.
      - name: Setup toolchain (cached venv, direct-HTTP only)
        uses: ./.github/actions/setup-i2i
        with:
          extras: dev

      - name: Run tests
        run: .venv-ci/bin/python -m pytest -q

      - name: Pre-flight — checkout must be clean before git-crypt unlock
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Checkout is dirty before git-crypt unlock."
            git status --porcelain
            echo "A test or setup step wrote into the checkout; isolate that write before merging."
            exit 1
          fi
          echo "checkout clean — safe to unlock git-crypt"

      - name: Unlock git-crypt
        uses: flydiverny/setup-git-crypt@v5

      - name: Decrypt git-crypt files
        env:
          GIT_CRYPT_KEY: ${{ secrets.GIT_CRYPT_KEY }}
        run: |
          echo "$GIT_CRYPT_KEY" | base64 -d > git-crypt-key
          git-crypt unlock git-crypt-key

      - name: Run scraper (self-looping)
        env:
          I2I_STORAGE: json
          I2I_EMAIL: ${{ secrets.I2I_EMAIL }}
          I2I_PASSWORD: ${{ secrets.I2I_PASSWORD }}
          I2I_CSRF_TOKEN: ${{ secrets.I2I_CSRF_TOKEN }}
          I2I_SESSION_ID: ${{ secrets.I2I_SESSION_ID }}
          TELEGRAM_ENABLED: ${{ secrets.TELEGRAM_ENABLED }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_ENABLED: ${{ secrets.NTFY_ENABLED }}
          NTFY_BASE_URL: ${{ secrets.NTFY_BASE_URL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_USER: ${{ secrets.NTFY_USER }}
          NTFY_PASSWORD: ${{ secrets.NTFY_PASSWORD }}
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
          PRIORITY_HIGH_RATE_PCT: ${{ vars.PRIORITY_HIGH_RATE_PCT || '70' }}
          PRIORITY_MEDIUM_RATE_PCT: ${{ vars.PRIORITY_MEDIUM_RATE_PCT || '50' }}
          NOTIFY_MIN_RATE_PCT: ${{ vars.NOTIFY_MIN_RATE_PCT || '40' }}
          NOTIFY_BUCKET_MIN_RATE_PCT: ${{ vars.NOTIFY_BUCKET_MIN_RATE_PCT || '0' }}
          NOTIFY_HIGH_RATE_PCT: ${{ vars.NOTIFY_HIGH_RATE_PCT || '100' }}
          I2I_DIGEST_HOURS: ${{ vars.I2I_DIGEST_HOURS || '6' }}
          STARTUP_JITTER_MS: ${{ vars.STARTUP_JITTER_MS || '2000' }}
          # 25 passes at ~60-second intervals. This gives near-real-time
          # notification: new loans appear in Telegram within ~60 seconds of
          # the scrape cycle starting. Each pass is HTTP-only (~10-15s), so
          # 25 iterations fit in the 45-minute job timeout.
          POLL_INTERVAL_S: '60'
          POLL_ITERATIONS: '25'
        run: .venv-ci/bin/python -m i2i_watch --iterations ${{ vars.POLL_ITERATIONS || '25' }} --interval ${{ vars.POLL_INTERVAL_S || '60' }} -v ${{ github.event.inputs.reset_notify_state == 'true' && '--reset-notify-state' || '' }}

      - name: Commit and publish updated data (state persistence — dedup across runs)
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Scraper owns only its state files. Investment state belongs to
          # invest.yml and must never be staged here.
          git add data/active-loans.json data/notifications-sent.json \
                  data/notify-state.json data/stats.json data/runs.json \
                  data/archive 2>/dev/null || true
          echo "=== staged files ==="
          git diff --cached --stat

          if git diff --cached --quiet; then
            echo "no data change"
          else
            git commit -m "data: i2i scrape $(date -u +'%F %H:%MZ')"

            # git-crypt leaves the decrypted .env marked modified after the
            # scraper uses it (its clean/smudge filters keep index and worktree
            # out of sync on a fresh checkout). Restore the tracked blob from
            # HEAD so the working tree matches the commit, then verify clean.
            # Any other dirty file is unexpected and must fail visibly.
            dirty_files=$(git diff --name-only)
            unexpected_dirty=$(printf '%s\n' "$dirty_files" | sed '/^$/d;/^\.env$/d;/^i2i-yield-watch-sa\.json$/d')
            if [ -n "$unexpected_dirty" ]; then
              echo "::error::Unexpected dirty file after data commit: $unexpected_dirty"
              exit 1
            fi
            for f in .env i2i-yield-watch-sa.json; do
              if [ -f "$f" ] && ! git diff --quiet -- "$f"; then
                git checkout -- "$f"
              fi
            done
            rm -f git-crypt-key
            if [ -n "$(git status --porcelain)" ]; then
              echo "::error::Checkout is still dirty before data push"
              git status --short
              exit 1
            fi

            # Do not use pull --autostash: it previously conflicted while
            # applying the decrypted .env and still returned success. A green
            # run now means the fresh data reached origin/main.
            # -X theirs: a concurrent scrape can land a newer data commit
            # between this run's checkout and its push (runs are pinned to
            # their creation SHA, so the rebase then conflicts on the
            # scrape-owned files). The data this run just scraped is newer,
            # so it wins; the conflict is deterministic and retrying without
            # -X theirs would fail forever.
            echo "base commit: $(git rev-parse --short HEAD)  origin/main: $(git rev-parse --short origin/main)"
            pushed=false
            for i in 1 2 3; do
              if git fetch origin main \
                  && git rebase -X theirs origin/main \
                  && git push origin HEAD:main; then
                pushed=true
                echo "data pushed: $(git rev-parse --short HEAD)"
                break
              fi
              echo "push attempt $i failed, retrying..."
              git rebase --abort 2>/dev/null || true
              sleep 5
            done
            if [ "$pushed" != true ]; then
              echo "::error::Scrape data commit was not pushed after 3 attempts"
              exit 1
            fi
          fi

      - name: Alert on failure (a broken scraper = silent missed notifications)
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set +e
          [ -z "$TELEGRAM_BOT_TOKEN" ] && { echo "no telegram token; skip alert"; exit 0; }
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          # Self-identifying alert: an alert for an OLD failed run must never
          # look like a live failure. Include run start time + failing step.
          STARTED=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" --jq '.created_at' 2>/tmp/gh_api_err || echo "unknown")
          [ "$STARTED" = "unknown" ] && echo "gh api run metadata failed: $(cat /tmp/gh_api_err)"
          FAIL_STEP=$(gh run view "${GITHUB_RUN_ID}" --repo "${GITHUB_REPOSITORY}" --json jobs \
            --jq '[.jobs[].steps[] | select(.conclusion == "failure")] | if length > 0 then .[0].name else "unknown" end' 2>/tmp/gh_run_err || echo "unknown")
          [ "$FAIL_STEP" = "unknown" ] && echo "gh run view failed: $(cat /tmp/gh_run_err)"
          # Consecutive failures: completed runs since the last green one, so a
          # bad streak doesn't spam identical alerts. Counts failure entries
          # before the first success in the last 10 runs.
          CONSEC=$(gh run list --repo "${GITHUB_REPOSITORY}" --workflow "${GITHUB_WORKFLOW}" --limit 10 --json conclusion \
            --jq '[.[].conclusion] | (index("success") // length) as $n | .[0:$n] | length' 2>/dev/null || echo 0)
          MSG="⚠️ <b>i2i SCRAPER run FAILED</b>%0AStarted: ${STARTED} UTC%0AFailing step: ${FAIL_STEP}%0AConsecutive failures: ${CONSEC}%0ANotifications may be paused until the next good run.%0A${RUN_URL}"
          curl -sS --max-time 20 -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" -d parse_mode=HTML -d text="$MSG" >/dev/null \
            && echo "failure alert sent" || echo "failure alert send failed"

  deploy:
    needs: scrape
    runs-on: ubuntu-latest
    if: always() && needs.scrape.result == 'success'

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          ref: main

      - name: Build Pages artifact (_site = dashboard + data)
        run: |
          set -euo pipefail
          mkdir -p _site
          cp dashboard/index.html dashboard/app.js dashboard/styles.css _site/
          cp -r data _site/data
          test -s _site/index.html
          test -s _site/data/active-loans.json
          test -s _site/data/stats.json
          echo "Pages artifact data timestamp:"
          grep -m1 'lastUpdated' _site/data/stats.json || true

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
