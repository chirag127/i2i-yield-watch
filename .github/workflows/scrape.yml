name: i2i Yield Watch — Auto Scraper

on:
  schedule:
    # GitHub throttles/drops high-frequency cron; a `*/5` degrades to ~hourly.
    # We ask for every 15 min (GitHub honors longer intervals far more
    # reliably) and each run SELF-LOOPS ~5 scrapes x 60s internally (see the
    # "Run scraper (self-looping)" step) to approximate 5-min polling even
    # when GitHub fires sparsely. GitHub cron is UTC.
    - cron: '3,18,33,48 * * * *'
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      use_playwright_fallback:
        description: 'Use the Playwright DOM fallback path'
        type: boolean
        default: false
        required: false
  repository_dispatch:
    types: [tick]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  USE_PLAYWRIGHT_FALLBACK: ${{ inputs.use_playwright_fallback == 'true' && 'true' || 'false' }}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      data_changed: ${{ steps.check.outputs.changed }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Cache npm dependencies
        uses: actions/cache@v6
        with:
          path: scraper/node_modules
          key: npm-${{ runner.os }}-${{ hashFiles('scraper/package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Cache Playwright Chromium
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('scraper/package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install dependencies
        working-directory: scraper
        run: npm ci --prefer-offline

      - name: Lint
        working-directory: scraper
        run: npm run lint

      - name: Run tests
        working-directory: scraper
        run: npm test

      - name: Unlock git-crypt
        uses: flydiverny/setup-git-crypt@v5

      - name: Decrypt git-crypt files
        env:
          GIT_CRYPT_KEY: ${{ secrets.GIT_CRYPT_KEY }}
        run: |
          echo "$GIT_CRYPT_KEY" | base64 -d > git-crypt-key
          git-crypt unlock git-crypt-key

      - name: Write Firebase service account JSON
        env:
          FIREBASE_SA_JSON: ${{ secrets.FIREBASE_SA_JSON }}
        run: |
          if [ -n "${FIREBASE_SA_JSON:-}" ]; then
            printf '%s' "$FIREBASE_SA_JSON" > i2i-yield-watch-sa.json
            echo "Wrote $(wc -c < i2i-yield-watch-sa.json) bytes to i2i-yield-watch-sa.json"
          else
            echo "No FIREBASE_SA_JSON secret — using git-crypt-decrypted file"
          fi

      - name: Install Playwright Chromium
        working-directory: scraper
        run: npx playwright install chromium --with-deps

      - name: Run scraper (self-looping)
        working-directory: scraper
        env:
          # Config is loaded from git-crypt-decrypted .env.
          # Secrets below override .env only when set.
          TELEGRAM_ENABLED: ${{ secrets.TELEGRAM_ENABLED }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EMAIL_ENABLED: ${{ secrets.EMAIL_ENABLED }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          DISCORD_ENABLED: ${{ secrets.DISCORD_ENABLED }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          NTFY_ENABLED: ${{ secrets.NTFY_ENABLED }}
          NTFY_BASE_URL: ${{ secrets.NTFY_BASE_URL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_USER: ${{ secrets.NTFY_USER }}
          NTFY_PASSWORD: ${{ secrets.NTFY_PASSWORD }}
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
          MAX_SHOW_MORE_CLICKS: '150'
          HIGH_PRIORITY_RATE_THRESHOLD: '70'
          MEDIUM_PRIORITY_RATE_THRESHOLD: '50'
          NOTIFY_RATE_THRESHOLD: '50'
          STARTUP_JITTER_MS: '2000'
          # Self-loop: GitHub cron is unreliable at high frequency, so one run
          # polls several times ~60s apart to approximate 5-min cadence even
          # when GitHub fires only every 15-30 min. Each iteration diffs against
          # the storage the previous iteration wrote, so notifications chain
          # correctly and stay near-real-time.
          SCRAPE_ITERATIONS: '5'
          SCRAPE_INTERVAL_SECONDS: '60'
        run: |
          set +e
          for i in $(seq 1 "${SCRAPE_ITERATIONS}"); do
            echo "::group::scrape iteration $i/${SCRAPE_ITERATIONS}"
            node src/core/index.js
            code=$?
            echo "iteration $i exit=$code"
            echo "::endgroup::"
            # Stop looping if the scraper hard-fails (exit 1) — surfaces the error.
            if [ "$code" -ne 0 ]; then
              echo "scraper failed on iteration $i (exit $code)"
              exit "$code"
            fi
            # No sleep after the final iteration.
            if [ "$i" -lt "${SCRAPE_ITERATIONS}" ]; then
              sleep "${SCRAPE_INTERVAL_SECONDS}"
            fi
          done

      - name: Mark output
        id: check
        run: echo "changed=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: scrape
    runs-on: ubuntu-latest
    if: always() && needs.scrape.result == 'success'

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
