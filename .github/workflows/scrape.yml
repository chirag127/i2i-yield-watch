name: i2i Yield Watch — Auto Scraper

# CONTINUOUS ALIVE (replaces the old 5-min cron + 8-pass burst):
#   - No schedule here at all. tick.yml (the "tick pinger") runs on a 5-min
#     cron (GitHub's floor) and dispatches this workflow ONLY when no scraper
#     run is alive — so a dead scraper is restarted within ~5 min of dying.
#   - Each scraper job runs in CONTINUOUS mode (--iterations 0) for its full
#     340-min timeout. Each pass scrapes via direct HTTP (~15s) and sleeps 30s,
#     so new loans are detected and notified within ~30s — independent of
#     GitHub cron delays.
#   - ~10 min before the job timeout, the job commits final state, dispatches
#     a successor scraper run, and exits; concurrency cancel-in-progress:
#     false queues the successor, so the handoff gap is seconds, not minutes.
#   - A companion loop commits data/*.json every 60s (git-as-DB) so a job
#     killed by timeout/crash never loses its last-scraped state.
#
# The scraper owns ONLY data/active-loans.json, data/notifications-sent.json,
# data/notify-state.json, data/stats.json, data/runs.json, data/archive.
# Investment state (invested-loans.json) belongs to invest.yml.

on:
  workflow_dispatch:
    inputs:
      reset_notify_state:
        description: 'Clear notify-state so all currently-qualifying loans re-announce once'
        type: boolean
        default: false
  repository_dispatch:
    types: [tick]

permissions:
  contents: write
  actions: write      # self-handoff dispatch via GITHUB_TOKEN

concurrency:
  group: scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 340

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # Direct HTTP avoids the historical Playwright/apt-get cold-start failure.
      - name: Setup toolchain (cached venv, direct-HTTP only)
        uses: ./.github/actions/setup-i2i
        with:
          extras: dev

      - name: Run tests
        run: .venv-ci/bin/python -m pytest -q

      - name: Pre-flight — checkout must be clean before git-crypt unlock
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Checkout is dirty before git-crypt unlock."
            git status --porcelain
            echo "A test or setup step wrote into the checkout; isolate that write before merging."
            exit 1
          fi
          echo "checkout clean — safe to unlock git-crypt"

      - name: Unlock git-crypt
        uses: flydiverny/setup-git-crypt@v5

      - name: Decrypt git-crypt files
        env:
          GIT_CRYPT_KEY: ${{ secrets.GIT_CRYPT_KEY }}
        run: |
          echo "$GIT_CRYPT_KEY" | base64 -d > git-crypt-key
          git-crypt unlock git-crypt-key

      - name: Run scraper (continuous, self-handoff)
        env:
          I2I_STORAGE: json
          I2I_EMAIL: ${{ secrets.I2I_EMAIL }}
          I2I_PASSWORD: ${{ secrets.I2I_PASSWORD }}
          I2I_CSRF_TOKEN: ${{ secrets.I2I_CSRF_TOKEN }}
          I2I_SESSION_ID: ${{ secrets.I2I_SESSION_ID }}
          TELEGRAM_ENABLED: ${{ secrets.TELEGRAM_ENABLED }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_ENABLED: ${{ secrets.NTFY_ENABLED }}
          NTFY_BASE_URL: ${{ secrets.NTFY_BASE_URL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_USER: ${{ secrets.NTFY_USER }}
          NTFY_PASSWORD: ${{ secrets.NTFY_PASSWORD }}
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
          PRIORITY_HIGH_RATE_PCT: ${{ vars.PRIORITY_HIGH_RATE_PCT || '70' }}
          PRIORITY_MEDIUM_RATE_PCT: ${{ vars.PRIORITY_MEDIUM_RATE_PCT || '50' }}
          NOTIFY_MIN_RATE_PCT: ${{ vars.NOTIFY_MIN_RATE_PCT || '40' }}
          NOTIFY_BUCKET_MIN_RATE_PCT: ${{ vars.NOTIFY_BUCKET_MIN_RATE_PCT || '0' }}
          NOTIFY_HIGH_RATE_PCT: ${{ vars.NOTIFY_HIGH_RATE_PCT || '100' }}
          I2I_DIGEST_HOURS: ${{ vars.I2I_DIGEST_HOURS || '6' }}
          STARTUP_JITTER_MS: ${{ vars.STARTUP_JITTER_MS || '2000' }}
          POLL_INTERVAL_S: ${{ vars.POLL_INTERVAL_S || '30' }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SCRAPE_HANDOFF_MIN: '330'
          SCRAPE_STATE_PUSH_S: '60'
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Continuous mode: --iterations 0 = poll forever. Each pass scrapes
          # via direct HTTP (~15s) and sleeps 30s. New loans are detected and
          # notified within ~30s — independent of GitHub cron delays.
          .venv-ci/bin/python -m i2i_watch --iterations 0 --interval ${{ vars.POLL_INTERVAL_S || '30' }} -v ${{ github.event.inputs.reset_notify_state == 'true' && '--reset-notify-state' || '' }} &
          SCRAPE_PID=$!
          START=$(date +%s)
          HANDOFF_AT=$(( ${SCRAPE_HANDOFF_MIN} * 60 ))
          LAST_PUSH=0

          while kill -0 "$SCRAPE_PID" 2>/dev/null; do
            NOW=$(date +%s)
            ELAPSED=$(( NOW - START ))

            # Crash-safe state: push data/*.json every 60s (git-as-DB) so a
            # job killed by timeout/runner-death still has its latest scrape.
            if [ $(( ELAPSED - LAST_PUSH )) -ge ${SCRAPE_STATE_PUSH_S} ]; then
              LAST_PUSH=$ELAPSED
              git add data/active-loans.json data/notifications-sent.json \
                      data/notify-state.json data/stats.json data/runs.json \
                      data/archive 2>/dev/null || true
              if ! git diff --cached --quiet; then
                # Restore git-crypt-affected files so they don't block push.
                for f in .env i2i-yield-watch-sa.json; do
                  if [ -f "$f" ] && ! git diff --quiet -- "$f"; then
                    git checkout -- "$f"
                  fi
                done
                if git commit -m "data: i2i scrape $(date -u +'%F %H:%MZ')" \
                    && git fetch origin main -q \
                    && git rebase -X theirs origin/main -q \
                    && git push origin HEAD:main -q; then
                  echo "state pushed (t=${ELAPSED}s)"
                else
                  echo "::warning::state push failed at t=${ELAPSED}s (will retry)"
                  if [ -d .git/rebase-merge ] || [ -d .git/rebase-apply ]; then
                    git rebase --abort
                  fi
                fi
              fi
            fi

            # Handoff: shortly before the job timeout, dispatch the successor
            # (queued behind this job) and exit — gap = seconds.
            if [ $ELAPSED -ge $HANDOFF_AT ]; then
              echo "handing off — dispatching successor scraper run (t=${ELAPSED}s)"
              # Final state push before handoff.
              git add data/active-loans.json data/notifications-sent.json \
                      data/notify-state.json data/stats.json data/runs.json \
                      data/archive 2>/dev/null || true
              if ! git diff --cached --quiet; then
                for f in .env i2i-yield-watch-sa.json; do
                  if [ -f "$f" ] && ! git diff --quiet -- "$f"; then
                    git checkout -- "$f"
                  fi
                done
                git commit -m "data: i2i scrape $(date -u +'%F %H:%MZ')" || true
                git fetch origin main -q && git rebase -X theirs origin/main -q && git push origin HEAD:main -q || true
              fi
              rm -f git-crypt-key
              gh workflow run scrape.yml --repo "${GITHUB_REPOSITORY}" || \
                echo "::warning::handoff dispatch failed; tick pinger will restart"
              kill "$SCRAPE_PID" 2>/dev/null || true
              wait "$SCRAPE_PID" 2>/dev/null || true
              echo "handoff complete"
              exit 0
            fi

            sleep 5
          done
          # Capture the real exit code: `wait ... || true` would mask a
          # scraper crash as rc=0 and suppress the failure alert.
          if wait "$SCRAPE_PID" 2>/dev/null; then
            SCRAPE_RC=0
          else
            SCRAPE_RC=$?
          fi
          echo "scraper exited on its own (t=$(( $(date +%s) - START ))s, rc=${SCRAPE_RC})"
          # Final flush: push any uncommitted state.
          git add data/active-loans.json data/notifications-sent.json \
                  data/notify-state.json data/stats.json data/runs.json \
                  data/archive 2>/dev/null || true
          if ! git diff --cached --quiet; then
            for f in .env i2i-yield-watch-sa.json; do
              if [ -f "$f" ] && ! git diff --quiet -- "$f"; then
                git checkout -- "$f"
              fi
            done
            git commit -m "data: i2i scrape $(date -u +'%F %H:%MZ')"
            for i in 1 2 3; do
              if git fetch origin main && git rebase -X theirs origin/main && git push origin HEAD:main; then
                break
              fi
              git rebase --abort 2>/dev/null || true
              sleep 5
            done
          fi
          rm -f git-crypt-key
          # If the scraper exited with an error (broken creds, API change),
          # fail the job so the alert fires.
          if [ "${SCRAPE_RC}" -ne 0 ]; then
            echo "::error::Scraper exited with rc=${SCRAPE_RC}"
            exit 1
          fi

      - name: Alert on failure (a broken scraper = silent missed notifications)
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          [ -z "$TELEGRAM_BOT_TOKEN" ] && { echo "no telegram token; skip alert"; exit 0; }
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          STARTED=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" --jq '.created_at' 2>/tmp/gh_api_err || echo "unknown")
          [ "$STARTED" = "unknown" ] && echo "gh api run metadata failed: $(cat /tmp/gh_api_err)"
          FAIL_STEP=$(gh run view "${GITHUB_RUN_ID}" --repo "${GITHUB_REPOSITORY}" --json jobs \
            --jq '[.jobs[].steps[] | select(.conclusion == "failure")] | if length > 0 then .[0].name else "unknown" end' 2>/tmp/gh_run_err || echo "unknown")
          [ "$FAIL_STEP" = "unknown" ] && echo "gh run view failed: $(cat /tmp/gh_run_err)"
          CONSEC=$(gh run list --repo "${GITHUB_REPOSITORY}" --workflow "${GITHUB_WORKFLOW}" --limit 10 --json conclusion \
            --jq '[.[].conclusion] | (index("success") // length) as $n | .[0:$n] | length' 2>/dev/null || echo 0)
          MSG="⚠️ <b>i2i SCRAPER run FAILED</b>%0AStarted: ${STARTED} UTC%0AFailing step: ${FAIL_STEP}%0AConsecutive failures: ${CONSEC}%0ANotifications may be paused until the next good run.%0A${RUN_URL}"
          curl -sS --max-time 20 -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" -d parse_mode=HTML -d text="$MSG" >/dev/null \
            && echo "failure alert sent" || echo "failure alert send failed"
