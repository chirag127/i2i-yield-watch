name: i2i Yield Watch — Auto Scraper

on:
  schedule:
    # GitHub throttles/drops high-frequency cron; a `*/5` degrades to ~hourly.
    # We ask for every 15 min (GitHub honors longer intervals far more
    # reliably) and each run SELF-LOOPS ~5 scrapes x 60s internally (see the
    # "Run scraper (self-looping)" step) to approximate 5-min polling even
    # when GitHub fires sparsely. GitHub cron is UTC.
    - cron: '3,18,33,48 * * * *'
  # NO push trigger: every commit to main (invest.yml's invested-loans commits,
  # scrape.yml's own data commits, dependabot merges) used to fire an immediate
  # re-scrape — a self-triggering chain that made the effective interval ~0,
  # queued runs behind each other in the concurrency group, and collided with
  # invest.yml's real-money pushes. The schedule + workflow_dispatch above are
  # the only triggers; the effective scrape interval is now exactly the cron
  # cadence (15 min), and the deploy job still updates Pages after each run.
  workflow_dispatch:
    inputs:
      reset_notify_state:
        description: 'Clear notify-state so all currently-qualifying loans re-announce once'
        type: boolean
        default: false
  repository_dispatch:
    types: [tick]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    # Cold runners can take 10-15 min on Playwright install alone; 20m killed
    # runs mid-install (observed 2026-08-18). 45m gives cold install + self-loop
    # + git-crypt + tests comfortable headroom.
    timeout-minutes: 45
    outputs:
      data_changed: ${{ steps.check.outputs.changed }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup toolchain (cached venv + Playwright Chromium)
        uses: ./.github/actions/setup-i2i
        with:
          extras: browser,dev

      - name: Run tests
        run: .venv-ci/bin/python -m pytest -q

      - name: Unlock git-crypt
        uses: flydiverny/setup-git-crypt@v5

      - name: Decrypt git-crypt files
        env:
          GIT_CRYPT_KEY: ${{ secrets.GIT_CRYPT_KEY }}
        run: |
          echo "$GIT_CRYPT_KEY" | base64 -d > git-crypt-key
          git-crypt unlock git-crypt-key

      - name: Run scraper (self-looping)
        env:
          # git-as-DB JSON backend only — Firestore free tier 429'd under the
          # self-loop and silently killed notifications. State lives in data/*.json.
          I2I_STORAGE: json
          # Config loaded from git-crypt-decrypted .env; secrets below override.
          TELEGRAM_ENABLED: ${{ secrets.TELEGRAM_ENABLED }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          I2I_DIGEST_HOURS: ${{ vars.I2I_DIGEST_HOURS }}
          NTFY_ENABLED: ${{ secrets.NTFY_ENABLED }}
          NTFY_BASE_URL: ${{ secrets.NTFY_BASE_URL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_USER: ${{ secrets.NTFY_USER }}
          NTFY_PASSWORD: ${{ secrets.NTFY_PASSWORD }}
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
          PRIORITY_HIGH_RATE_PCT: '70'
          PRIORITY_MEDIUM_RATE_PCT: '50'
          # TWO-TIER NOTIFICATION GATES (see config.py):
          #   NOTIFY_MIN_RATE_PCT=50  -> standard Telegram alert (rate > 50%)
          #   NOTIFY_HIGH_RATE_PCT=100 -> LOUD alert the moment a >100% loan posts
          NOTIFY_MIN_RATE_PCT: '50'
          NOTIFY_HIGH_RATE_PCT: '100'
          # Periodic digest: even when the qualifying set is UNCHANGED, re-send
          # every N hours so a stable market never goes silent forever.
          I2I_DIGEST_HOURS: '6'
          STARTUP_JITTER_MS: '2000'
          # Self-loop: one run polls several times ~60s apart to approximate
          # 5-min cadence even when GitHub fires only every 15-30 min. Each
          # iteration diffs against the storage the previous iteration wrote,
          # so notifications chain correctly and stay near-real-time.
        run: .venv-ci/bin/python -m i2i_watch --iterations 2 --interval 90 -v ${{ github.event.inputs.reset_notify_state == 'true' && '--reset-notify-state' || '' }}

      - name: Commit updated data (state persistence — dedup across runs)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # OWNERSHIP PARTITION: scrape commits ONLY its own state files. The
          # invested-loans*.json files belong to invest.yml — never stage them
          # here, or concurrent invest runs collide on rebase/push (the two
          # workflows must not interfere; see invest.yml).
          git add data/active-loans.json data/notifications-sent.json \
                  data/notify-state.json data/stats.json data/runs.json \
                  data/archive data/index.html 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no data change"
          else
            git commit -m "data: i2i scrape $(date -u +'%F %H:%MZ')"
            # Retry loop (same as invest.yml): a concurrent invest push can
            # transiently reject ours. A skipped push would silently drop the
            # notify-state update on the ephemeral runner, and the next run
            # would re-fire duplicate notifications from stale state — so
            # retry until it lands.
            for i in 1 2 3; do
              git pull --rebase --autostash origin main && git push && break
              echo "push attempt $i failed, retrying..."
              git rebase --abort 2>/dev/null || true
              sleep 5
            done
          fi

      - name: Mark output
        id: check
        run: echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Alert on failure (a broken scraper = silent missed notifications)
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          [ -z "$TELEGRAM_BOT_TOKEN" ] && { echo "no telegram token; skip alert"; exit 0; }
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          MSG="⚠️ <b>i2i SCRAPER run FAILED</b>%0ANotifications may be paused until the next good run.%0A${RUN_URL}"
          curl -sS --max-time 20 -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" -d parse_mode=HTML -d text="$MSG" >/dev/null \
            && echo "failure alert sent" || echo "failure alert send failed"

  deploy:
    needs: scrape
    runs-on: ubuntu-latest
    if: always() && needs.scrape.result == 'success'

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          ref: main

      - name: Build Pages artifact (_site = dashboard + data)
        run: |
          mkdir -p _site
          cp dashboard/index.html dashboard/app.js dashboard/styles.css _site/
          cp -r data _site/data

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
