name: i2i Yield Watch — Auto Scraper

on:
  schedule:
    # GitHub throttles/drops high-frequency cron; a `*/5` degrades to ~hourly.
    # We ask for every 15 min (GitHub honors longer intervals far more
    # reliably) and each run SELF-LOOPS ~5 scrapes x 60s internally (see the
    # "Run scraper (self-looping)" step) to approximate 5-min polling even
    # when GitHub fires sparsely. GitHub cron is UTC.
    - cron: '3,18,33,48 * * * *'
  push:
    branches:
      - main
  workflow_dispatch:
  repository_dispatch:
    types: [tick]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      data_changed: ${{ steps.check.outputs.changed }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[browser,dev]"

      - name: Run tests
        run: python -m pytest -q

      - name: Install Playwright Chromium
        run: python -m playwright install chromium --with-deps

      - name: Unlock git-crypt
        uses: flydiverny/setup-git-crypt@v5

      - name: Decrypt git-crypt files
        env:
          GIT_CRYPT_KEY: ${{ secrets.GIT_CRYPT_KEY }}
        run: |
          echo "$GIT_CRYPT_KEY" | base64 -d > git-crypt-key
          git-crypt unlock git-crypt-key

      - name: Write Firebase service account JSON
        env:
          FIREBASE_SA_JSON: ${{ secrets.FIREBASE_SA_JSON }}
        run: |
          if [ -n "${FIREBASE_SA_JSON:-}" ]; then
            printf '%s' "$FIREBASE_SA_JSON" > i2i-yield-watch-sa.json
            echo "Wrote $(wc -c < i2i-yield-watch-sa.json) bytes to i2i-yield-watch-sa.json"
          else
            echo "No FIREBASE_SA_JSON secret — using git-crypt-decrypted file"
          fi

      - name: Run scraper (self-looping)
        env:
          # Config loaded from git-crypt-decrypted .env; secrets below override.
          TELEGRAM_ENABLED: ${{ secrets.TELEGRAM_ENABLED }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_ENABLED: ${{ secrets.NTFY_ENABLED }}
          NTFY_BASE_URL: ${{ secrets.NTFY_BASE_URL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_USER: ${{ secrets.NTFY_USER }}
          NTFY_PASSWORD: ${{ secrets.NTFY_PASSWORD }}
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
          HIGH_PRIORITY_RATE_THRESHOLD: '70'
          MEDIUM_PRIORITY_RATE_THRESHOLD: '50'
          NOTIFY_RATE_THRESHOLD: '40'
          STARTUP_JITTER_MS: '2000'
          # Self-loop: one run polls several times ~60s apart to approximate
          # 5-min cadence even when GitHub fires only every 15-30 min. Each
          # iteration diffs against the storage the previous iteration wrote,
          # so notifications chain correctly and stay near-real-time.
        run: python -m i2i_watch --iterations 5 --interval 60 -v

      - name: Mark output
        id: check
        run: echo "changed=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: scrape
    runs-on: ubuntu-latest
    if: always() && needs.scrape.result == 'success'

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
