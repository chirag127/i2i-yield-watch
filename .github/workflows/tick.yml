name: i2i Tick Pinger

# Keeps BOTH the Telegram command bot AND the continuous scraper alive.
#
# Both workflows run CONTINUOUSLY inside one long-lived job and self-hand-off
# before their job timeout. This pinger is the crash-recovery net: it checks
# every ~5 min whether each is alive (in_progress / queued); if not, it
# dispatches a fresh run. So a dead bot or scraper is restarted within ~5 min,
# and a healthy one is never disturbed (no double runs).
#
# The scraper now polls every ~30s around the clock — independent of GitHub
# cron delays — so new loans are detected and notified within ~30s.

on:
  schedule:
    - cron: '*/5 * * * *'          # every 5 min — GitHub's minimum cron cadence (crash recovery only; live detection is the 30s scraper)
  workflow_dispatch:
  repository_dispatch:
    types: [tick]

permissions:
  actions: write    # dispatch telegram-bot.yml and scrape.yml (and read run status)
  contents: read

concurrency:
  group: i2i-tick-pinger
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Dispatch the bot if it is not already alive
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          ALIVE=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/telegram-bot.yml/runs?per_page=10" \
            --jq '[.workflow_runs[] | select(.status != "completed")] | length' 2>/dev/null || echo 0)
          echo "bot runs alive/queued: ${ALIVE}"
          if [ "${ALIVE}" -gt 0 ]; then
            echo "bot is alive — nothing to do"
          else
            echo "no bot alive — dispatching"
            gh workflow run telegram-bot.yml --repo "${GITHUB_REPOSITORY}"
            echo "dispatched telegram-bot.yml"
          fi

      - name: Dispatch the scraper if it is not already alive
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          ALIVE=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/scrape.yml/runs?per_page=10" \
            --jq '[.workflow_runs[] | select(.status != "completed")] | length' 2>/dev/null || echo 0)
          echo "scraper runs alive/queued: ${ALIVE}"
          if [ "${ALIVE}" -gt 0 ]; then
            echo "scraper is alive — nothing to do"
          else
            echo "no scraper alive — dispatching"
            gh workflow run scrape.yml --repo "${GITHUB_REPOSITORY}"
            echo "dispatched scrape.yml"
          fi

      - name: Alert on failure (a dead pinger = bot and scraper never restart)
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          [ -z "$TELEGRAM_BOT_TOKEN" ] && { echo "no telegram token; skip alert"; exit 0; }
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          STARTED=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" --jq '.created_at' 2>/dev/null || echo "unknown")
          FAIL_STEP=$(gh run view "${GITHUB_RUN_ID}" --repo "${GITHUB_REPOSITORY}" --json jobs \
            --jq '[.jobs[].steps[] | select(.conclusion == "failure")] | if length > 0 then .[0].name else "unknown" end' 2>/dev/null || echo "unknown")
          MSG="⚠️ <b>i2i TICK PINGER run FAILED</b>%0AStarted: ${STARTED} UTC%0AFailing step: ${FAIL_STEP}%0AThe bot and/or scraper may not restart until this is fixed.%0A${RUN_URL}"
          curl -sS --max-time 20 -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" -d parse_mode=HTML -d text="$MSG" >/dev/null \
            && echo "failure alert sent" || echo "failure alert send failed"
