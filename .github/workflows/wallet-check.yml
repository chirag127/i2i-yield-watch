name: i2i Wallet Check

# Daily investable-escrow check: prints (and Telegram-pings) each account's REAL
# investable balance — availableWallet minus funds committed to open proposals.
# wallet() only runs inside invest when candidates exist, so a quiet market
# would otherwise hide a drained/frozen escrow until a loan appears. This
# workflow is the standing eyes-on-the-balance ping. Dispatchable anytime.

on:
  schedule:
    - cron: "30 7 * * *"   # daily 07:30 UTC (13:00 IST)
  workflow_dispatch:

permissions:
  contents: read
  actions: read        # failure-alert step reads run metadata via gh

jobs:
  wallet-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        account: [chirag, neeru]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      # direct-HTTP only (same as invest.yml) — no browser, no apt-get
      - name: Setup toolchain (cached venv)
        uses: ./.github/actions/setup-i2i
        with:
          extras: ''
      - name: Print investable escrow balance — ${{ matrix.account }}
        env:
          PYTHONIOENCODING: utf-8
          I2I_ACCOUNT: ${{ matrix.account }}
          I2I_EMAIL: ${{ secrets.I2I_EMAIL }}
          I2I_PASSWORD: ${{ secrets.I2I_PASSWORD }}
          I2I_CSRF_TOKEN: ${{ secrets.I2I_CSRF_TOKEN }}
          I2I_SESSION_ID: ${{ secrets.I2I_SESSION_ID }}
          I2I_NEERU_EMAIL: ${{ secrets.I2I_NEERU_EMAIL }}
          I2I_NEERU_PASSWORD: ${{ secrets.I2I_NEERU_PASSWORD }}
          I2I_NEERU_CSRF_TOKEN: ${{ secrets.I2I_NEERU_CSRF_TOKEN }}
          I2I_NEERU_SESSION_ID: ${{ secrets.I2I_NEERU_SESSION_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # The CLI prints the balance AND fires the low-escrow LOUD alert itself
          # (wallet() < WALLET_ALERT_THRESHOLD). The daily ping below is the
          # standing silent balance check; it reuses the same printed value.
        run: |
          OUT=$(.venv-ci/bin/python -m i2i_watch wallet --account ${{ matrix.account }} -v 2>&1)
          echo "$OUT"
          BAL=$(echo "$OUT" | grep -oE 'Rs [0-9,]+' | head -1)
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            curl -sS --max-time 20 -X POST \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_CHAT_ID}" -d parse_mode=HTML \
              -d "text=💳 <b>i2i escrow (${{ matrix.account }})</b>%0Ainvestable: ${BAL:-unavailable}" \
              >/dev/null && echo "telegram ping sent" || echo "telegram ping failed"
          fi

      - name: Alert on failure (a drained escrow must never go unnoticed)
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          [ -z "$TELEGRAM_BOT_TOKEN" ] && { echo "no telegram token; skip alert"; exit 0; }
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          STARTED=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" --jq '.created_at' 2>/dev/null || echo "unknown")
          FAIL_STEP=$(gh run view "${GITHUB_RUN_ID}" --repo "${GITHUB_REPOSITORY}" --json jobs \
            --jq '[.jobs[].steps[] | select(.conclusion == "failure")] | if length > 0 then .[0].name else "unknown" end' 2>/dev/null || echo "unknown")
          MSG="⚠️ <b>i2i WALLET CHECK run FAILED (${{ matrix.account }})</b>%0AStarted: ${STARTED} UTC%0AFailing step: ${FAIL_STEP}%0A${RUN_URL}"
          curl -sS --max-time 20 -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" -d parse_mode=HTML -d text="$MSG" >/dev/null \
            && echo "failure alert sent" || echo "failure alert send failed"
