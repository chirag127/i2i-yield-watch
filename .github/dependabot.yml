version: 2
updates:
  - package-ecosystem: npm
    directory: /scraper
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      production-dependencies:
        patterns:
          - '*'
        exclude-patterns:
          - 'eslint'
          - '@eslint/*'
          - 'globals'

    ignore:
      - dependency-name: "@chirag127/*"   # workspace/path deps Dependabot can't resolve
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
